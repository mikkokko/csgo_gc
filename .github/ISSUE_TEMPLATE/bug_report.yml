name: "Bug report"
description: "Report a bug, crash, or unexpected behavior in csgo_gc."
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before reporting, make sure there is no existing issue and that
        the problem isn't a known limitation, or a bug within the game itself.

        If possible, test whether the issue occurs without csgo_gc installed.

  - type: textarea
    id: description
    attributes:
      label: "What happened?"
      description: "Describe the issue and what you expected to happen."
      placeholder: "I expected X, but instead the game crashed."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to reproduce"
      description: "How can the issue be reproduced? If it's seemingly random, mention that instead."
      placeholder: |
        1. Open the inventory
        2. Perform action X
        3. Segmentation fault (core dumped)
    validations:
      required: true

  - type: input
    id: game_version
    attributes:
      label: "Game version"
      description: "Include the exact build number for older versions"
      placeholder: "e.g. Standalone (4465480), csgo_legacy branch (730), 1.30.0.1"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: "Environment"
      description: "Operating system and architecture."
      placeholder: "e.g. Void Linux, Windows 11, macOS 26 (x64)"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Logs and additional information"
      description: |
        If relevant, enable logging with `"log_output" "2"` in
        `csgo_gc/config.txt` and attach `gc_log.txt`.
